services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umutungo
      POSTGRES_USER: umutungo
      POSTGRES_PASSWORD: umutungo
    ports:
      - "5432:5432"
    volumes:
      - umutungo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umutungo -d umutungo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://umutungo:umutungo@db:5432/umutungo?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
      MIGRATIONS_PATH: migrations
      MEDIA_UPLOAD_DIR: /app/storage/media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    ports:
      - "8080:8080"
    volumes:
      - umutungo_media:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  umutungo_postgres_data:
  umutungo_media:
